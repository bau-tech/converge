name: Publish Docker images

# Two images published to GHCR: the frontend dashboard (root Dockerfile —
# no secrets baked in, see config.js.template/src/runtimeConfig.js for how
# it's configured per-deployment at container start instead) and
# bim-normalizer (bim-normalizer/Dockerfile — also runs bcf-server and
# converge-mcp, same image, different command/port per docker-compose.yml).
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: converge-dashboard
            context: .
            dockerfile: Dockerfile
          - image: converge-normalizer
            context: ./bim-normalizer
            dockerfile: bim-normalizer/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional second registry — only runs if the DOCKERHUB_USERNAME repo
      # *variable* (Settings -> Secrets and variables -> Actions -> Variables
      # tab, not Secrets — it's not sensitive) and the DOCKERHUB_TOKEN repo
      # *secret* (same page, Secrets tab; generate at hub.docker.com ->
      # Account Settings -> Security -> New Access Token) are both set.
      # Gated on the `vars.DOCKERHUB_USERNAME` check specifically (not
      # secrets) because the `secrets` context isn't available in step `if:`
      # conditions at all — confirmed via actionlint, which fails the whole
      # workflow file at parse time if you try, not just this step. Splitting
      # username into a non-secret var is what makes the conditional possible
      # in the first place, not just a style choice.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Extract metadata (Docker Hub)
        id: meta_dockerhub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
