name: Publish Docker images

# Four images published to GHCR (and Docker Hub, if configured — see the
# Docker Hub login step below): the frontend dashboard (root Dockerfile — no
# secrets baked in, see config.js.template/src/runtimeConfig.js for how it's
# configured per-deployment at container start instead), bim-normalizer
# (bim-normalizer/Dockerfile — main.py's own dependency set: fastapi/
# psycopg2/specklepy/ifcopenshell/ifc5d/ifctester/ifcclash/numpy/fastembed/
# ezdxf/cairosvg/python-docx/openpyxl/reportlab/etc.), bcf-server
# (bim-normalizer/Dockerfile.bcf-server — its own slim image; see that
# Dockerfile's header comment: bcf-server never touches ifcopenshell/numpy/
# fastembed/etc., so sharing the ~800MB bim-normalizer image just for
# bcf_server.py meant carrying dependencies it never used), and converge-mcp
# (bim-normalizer/Dockerfile.converge-mcp — same reasoning, its own slim
# image with just mcp[cli]/requests/ifcopenshell/ifc5d/uvicorn, no fastapi/
# psycopg2/specklepy/fastembed/ezdxf/cairosvg/python-docx/openpyxl/reportlab).
#
# The dockerhub-description job (below the publish matrix) keeps each Docker
# Hub repo's short description + README (docker/dockerhub/*.md) in sync on
# every run, so the four images are actually discoverable on hub.docker.com
# instead of sitting there with no description. It also syncs a fifth,
# overview-only repo (euch/converge — not a built image, create it once
# manually on Docker Hub) that describes the stack as a whole and links to
# the four real images, since Docker Hub has no org-level README.
on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: converge-dashboard
            context: .
            dockerfile: Dockerfile
          - image: converge-normalizer
            context: ./bim-normalizer
            dockerfile: bim-normalizer/Dockerfile
          - image: converge-bcf-server
            context: ./bim-normalizer
            dockerfile: bim-normalizer/Dockerfile.bcf-server
          - image: converge-mcp
            context: ./bim-normalizer
            dockerfile: bim-normalizer/Dockerfile.converge-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional second registry — only runs if the DOCKERHUB_USERNAME repo
      # *variable* (Settings -> Secrets and variables -> Actions -> Variables
      # tab, not Secrets — it's not sensitive) and the DOCKERHUB_TOKEN repo
      # *secret* (same page, Secrets tab; generate at hub.docker.com ->
      # Account Settings -> Security -> New Access Token) are both set.
      # Gated on the `vars.DOCKERHUB_USERNAME` check specifically (not
      # secrets) because the `secrets` context isn't available in step `if:`
      # conditions at all — confirmed via actionlint, which fails the whole
      # workflow file at parse time if you try, not just this step. Splitting
      # username into a non-secret var is what makes the conditional possible
      # in the first place, not just a style choice.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Extract metadata (Docker Hub)
        id: meta_dockerhub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Keeps each Docker Hub repo's short description + full README in sync so
  # the four images are actually discoverable/legible on hub.docker.com
  # instead of showing up with no description and an empty overview tab.
  # Runs once per workflow (not matrixed with `publish`) since it's just
  # metadata, not an image build. Same DOCKERHUB_USERNAME/DOCKERHUB_TOKEN
  # gate as the Docker Hub push above — no-ops entirely if Docker Hub isn't
  # configured.
  dockerhub-description:
    needs: publish
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync converge-dashboard description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/converge-dashboard
          short-description: "React frontend for BIM coordination, clash detection, BCF, ISO 19650 docs, and AI copilot."
          readme-filepath: ./docker/dockerhub/dashboard.md

      - name: Sync converge-normalizer description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/converge-normalizer
          short-description: "Core BIM API: Speckle ingestion, IFC export, clash/IDS checks, documents. Converge stack."
          readme-filepath: ./docker/dockerhub/normalizer.md

      - name: Sync converge-bcf-server description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/converge-bcf-server
          short-description: "BCF 2.1/3.0 issue-tracking API for Converge, with a BIMcollab OAuth shim."
          readme-filepath: ./docker/dockerhub/bcf-server.md

      - name: Sync converge-mcp description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/converge-mcp
          short-description: "MCP server exposing Converge BIM data to Claude: 85 tools over IFC/Speckle."
          readme-filepath: ./docker/dockerhub/mcp.md

      # Not a built image — an overview-only repo (create it once manually on
      # Docker Hub) that points at the four real images below, since Docker
      # Hub has no org-level README of its own.
      - name: Sync converge stack overview
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/converge
          short-description: "BIM coordination platform on Speckle: viewer, clash/IDS, BCF, ISO 19650 docs, AI copilot."
          readme-filepath: ./docker/dockerhub/stack.md
