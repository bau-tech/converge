services:
  bim-normalizer:
    build: .
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - speckle-network

  speckle-mcp:
    build: .
    command: ["python", "speckle_mcp.py", "--transport", "streamable-http", "--port", "8003"]
    ports:
      # Bind to all interfaces so Nginx Proxy Manager (separate LXC container)
      # can reach this via the Docker host's LAN IP.
      # Auth is enforced by the MCP server's API key middleware — set MCP_API_KEY in .env.
      - "8003:8003"
    env_file:
      - .env
    environment:
      # Reach the normalizer via Docker's internal network, not via localhost
      NORMALIZER_URL: http://bim-normalizer:8002
    depends_on:
      bim-normalizer:
        condition: service_healthy   # wait for /health to pass before starting MCP
    restart: unless-stopped
    networks:
      - speckle-network

networks:
  # Create once before first `docker compose up`:
  #   docker network create speckle-network
  speckle-network:
    external: true
