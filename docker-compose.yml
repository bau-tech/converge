# Every service below sets mem_limit — this host runs alongside ~30 other
# LXCs sharing the same physical RAM with little slack (see process_pool.py's
# worker-count comment), and without a cgroup cap a single runaway container
# competes for memory against all of them rather than failing on its own.
# Sized from observed idle usage (docker stats) plus headroom for real spikes
# (ifcopenshell/specklepy can balloon several GB processing a large model —
# see process_pool.py), not from a formal load test. bim-normalizer and
# converge-mcp get the most headroom since both hold whole models in memory;
# hitting the cap there OOM-kills the offending process (a pool worker, or,
# worst case, the container itself, which restart: unless-stopped recovers
# from) instead of pressuring the whole host.
services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: speckle-postgres
    mem_limit: 512m
    environment:
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_USER: ${PG_USER:-speckle}
      POSTGRES_PASSWORD: ${PG_PASS:-speckle}
      POSTGRES_DB: ${PG_NAME:-speckle}
      # Consumed only by postgres-init/01-nextcloud-db.sh on a fresh volume.
      NEXTCLOUD_DB_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      NEXTCLOUD_DB_PASS: ${NEXTCLOUD_DB_PASS:-}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-speckle}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - speckle-net

  # ── Nextcloud (document storage, versioning, per-user permissions) ──────────
  # Fully headless: auto-installs on first boot from the env vars below, no
  # web setup wizard. Nothing here is end-user-facing — every action goes
  # through the dashboard's own DocumentsPanel via bim-normalizer, which is
  # the only thing that ever talks to this container (plus the exposed port,
  # for admin/debug convenience only — never proxied by converge's nginx).
  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    # 512m OOM-killed the container under real use: previews (imagick +
    # ghostscript) spike hard on multiple concurrent large PDFs, and an
    # in-flight OOM-kill drops other simultaneous requests too (observed:
    # a document-folders listing failing with a 502 while previews for a
    # batch of PDFs were being generated). 1536m gives real headroom;
    # confirmed via `docker inspect nextcloud --format '{{.State.OOMKilled}}'`.
    mem_limit: 1536m
    ports:
      - "${NEXTCLOUD_PORT:-8005}:80"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASS:?NEXTCLOUD_DB_PASS is required}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD is required}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
      - nextcloud_config:/var/www/html/config
      - nextcloud_custom_apps:/var/www/html/custom_apps
      # Installs groupfolders automatically right after Nextcloud's own
      # auto-install completes — no manual `occ app:install` step needed.
      - ./nextcloud-hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # status.php returns 200 with "installed":false throughout Nextcloud's
      # first-boot auto-install (which can take well over start_period) — a
      # bare `curl -f` treats that as healthy, letting bim-normalizer start
      # making OCS calls against a Nextcloud that isn't actually ready yet
      # (symptom: OCS calls return the setup-wizard's HTML instead of JSON).
      test: ["CMD-SHELL", "curl -sf http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - speckle-net

  # ── Nextcloud cron (background jobs: preview pre-generation, etc.) ─────────
  # The official image ships no system cron of its own; Nextcloud's
  # background-job modes are AJAX/Webcron/cron, and previewgenerator
  # specifically requires "cron" mode (install-previewgenerator.sh sets it) —
  # AJAX only runs on page load, webcron isn't used here. Standard sidecar
  # pattern: same image + same volumes as nextcloud, entrypoint swapped to
  # the image's built-in /cron.sh, which just loops `php -f cron.php` every
  # 5 minutes. No Postgres env vars needed — cron.php reads db credentials
  # from config.php in the shared nextcloud_config volume.
  nextcloud-cron:
    image: nextcloud:apache
    container_name: nextcloud-cron
    mem_limit: 256m
    entrypoint: /cron.sh
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - nextcloud_html:/var/www/html
      - nextcloud_data:/var/www/html/data
      - nextcloud_config:/var/www/html/config
      - nextcloud_custom_apps:/var/www/html/custom_apps
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - speckle-net

  # ── BIM Normalizer ───────────────────────────────────────────────────────────
  # This service needs pull_policy: build, otherwise Compose's default policy
  # tries to PULL the bim-normalizer:latest tag from Docker Hub first (since an
  # explicit image: name makes Compose treat it as pullable) and only builds it
  # after racing/failing on the pull — confirmed: "pull access denied for
  # bim-normalizer" spam on a clean `up` after `down --rmi all`, even with
  # build: present on every service. pull_policy: build skips the pull attempt
  # entirely.
  # converge-mcp and bcf-server used to share this exact image (same codebase,
  # different entrypoint command) but now each build from their own
  # Dockerfile.converge-mcp / Dockerfile.bcf-server (same context, separate
  # image tags) — neither touches most of what main.py needs (ifcopenshell/
  # ifc5d/ifctester/ifcclash/specklepy/numpy/fastembed/ezdxf/cairosvg/
  # python-docx/openpyxl/reportlab/psycopg2/bcrypt/pyjwt/python-multipart —
  # between the two of them they use a small subset), so sharing this ~800MB
  # image just for their own entrypoint meant carrying dependencies neither
  # ever used. See each Dockerfile's own header comment.
  bim-normalizer:
    build:
      context: ./bim-normalizer
    image: bim-normalizer:latest
    pull_policy: build
    container_name: bim-normalizer
    # 3g OOM-killed a pool worker mid-embedding-batch (search/embeddings.py's
    # per-batch ONNX session recycling bounds *that* growth, but a
    # long-lived worker's peak RSS across dissimilar prior tasks — e.g. a
    # big ingest, glibc not always returning freed memory to the OS — isn't
    # bounded by it) — confirmed via dmesg's oom-kill entry naming the
    # python3.11 worker pid at ~3.05GB RSS while resuming an interrupted
    # embedding job. 4g gave headroom for a while, but a cross-model clash
    # check against a large IFC4X3 export (7500+ elements) blew past it too
    # — this time dmesg's oom-kill entry named the main uvicorn process
    # itself as the cgroup's victim (a memcg OOM kills whatever process in
    # the cgroup the kernel scores worst, not necessarily the worker that
    # actually caused the spike), taking the whole backend down for every
    # user instead of just failing one job. 6g gives more headroom; the LXC
    # has 10g total with ~8g typically free, so this still leaves room for
    # the rest of the stack.
    mem_limit: 6g
    ports:
      - "8002:8002"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SPECKLE_SERVER_URL: ${VITE_SPECKLE_SERVER}
      SPECKLE_TOKEN: ${VITE_SPECKLE_TOKEN}
      SPECKLE_SKIP_ANALYTICS: "true"
      # Was never passed to this service before (converge-mcp/converge already
      # get it) — bcf/admin.py's project-name lookup and reports/generate.py's
      # report-title project-name lookup both need it to reach any Speckle
      # server beyond the single default one.
      VITE_EXTRA_SPECKLE_SERVERS: ${VITE_EXTRA_SPECKLE_SERVERS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      AUTO_SYNC_SCAN_INTERVAL_S: ${AUTO_SYNC_SCAN_INTERVAL_S:-900}
      OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
      MISTRAL_API_KEY: ${VITE_MISTRAL_API_KEY:-}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-speckle}
      PG_PASS: ${PG_PASS:-speckle}
      PG_NAME: ${PG_NAME:-speckle}
      PORT: 8002
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-admin}
      NEXTCLOUD_APP_PASSWORD: ${NEXTCLOUD_APP_PASSWORD:-}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-}
      # Same-Docker-network callback URL for Nextcloud's webhook_listeners
      # app (see nextcloud/webhooks.py) — the default matches this service's
      # own Compose service name, so this only needs overriding if that name
      # ever changes. Requires Nextcloud's own allow_local_remote_servers
      # config enabled (occ config:system:set allow_local_remote_servers
      # --type=boolean --value=true) or Nextcloud's outgoing HTTP client
      # refuses the call as a same-network SSRF guard.
      BIM_NORMALIZER_INTERNAL_URL: ${BIM_NORMALIZER_INTERNAL_URL:-http://bim-normalizer:8002}
      # Now just a daily safety-net sweep — the webhook path above handles
      # same-day indexing of out-of-band Nextcloud changes.
      DOCUMENT_SYNC_SCAN_INTERVAL_S: ${DOCUMENT_SYNC_SCAN_INTERVAL_S:-86400}
      # BCF_API_KEY/BCF_OIDC_SECRET were previously only passed to bcf-server
      # below — bim-normalizer needs them too now, since dashboard_auth's
      # session signing (DASHBOARD_SESSION_SECRET) falls back through
      # BCF_OIDC_SECRET -> BCF_API_KEY the same way bcf-server's own admin
      # session/OAuth id_token signing already does (see config/settings.py).
      BCF_API_KEY: ${BCF_API_KEY:-}
      BCF_OIDC_SECRET: ${BCF_OIDC_SECRET:-}
      # reports/generate.py's BCF Coordination Report is the first thing in
      # this container that calls bcf-server directly (previously only
      # converge_mcp.py, an external process, ever did) — same URL that's
      # already passed to converge-mcp/converge below.
      BCF_SERVER_URL: http://bcf-server:8004
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      # DEV/TESTING ONLY — see the warning next to this var in .env.example.
      DASHBOARD_AUTH_BYPASS: ${DASHBOARD_AUTH_BYPASS:-}
      # notifications/email.py's send_email(), used by the document-workflow
      # notification feed (routers/documents.py -> notifications/dispatch.py).
      # Was previously unset here even though .env defines it, so send_email()
      # silently no-op'd (SMTP_HOST empty) for every deployed notification.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      nextcloud:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - speckle-net

  # ── Converge MCP Server (streamable HTTP, remote access) ──────────────────
  converge-mcp:
    build:
      context: ./bim-normalizer
      dockerfile: Dockerfile.converge-mcp
    image: converge-mcp:latest
    pull_policy: build
    container_name: converge-mcp
    mem_limit: 3g
    ports:
      - "8003:8003"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SPECKLE_SERVER_URL: ${VITE_SPECKLE_SERVER}
      SPECKLE_TOKEN: ${VITE_SPECKLE_TOKEN}
      # speckle_list_servers/the `server=` param on the direct-Speckle tools
      # need this to see any server beyond the single default one.
      VITE_EXTRA_SPECKLE_SERVERS: ${VITE_EXTRA_SPECKLE_SERVERS:-}
      NORMALIZER_URL: http://bim-normalizer:8002
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      # BCF tools (topics/comments/viewpoints) — same shared credential
      # bcf-server itself and the dashboard's own BCF panel already use.
      BCF_SERVER_URL: http://bcf-server:8004
      BCF_API_KEY: ${BCF_API_KEY:-}
      # Documents/CDE tools need a real dashboard login, not just this key.
      # converge_mcp.py falls back to BCF_ADMIN_EMAIL/PASSWORD (bcf-server's
      # own optional bootstrap admin account) when the dedicated pair below
      # isn't set — passing both through here, Python picks the right one.
      BCF_ADMIN_EMAIL: ${BCF_ADMIN_EMAIL:-}
      BCF_ADMIN_PASSWORD: ${BCF_ADMIN_PASSWORD:-}
      MCP_DASHBOARD_EMAIL: ${MCP_DASHBOARD_EMAIL:-}
      MCP_DASHBOARD_PASSWORD: ${MCP_DASHBOARD_PASSWORD:-}
    depends_on:
      bim-normalizer:
        condition: service_healthy
    restart: unless-stopped
    # No healthcheck: — Dockerfile.converge-mcp defines none (converge_mcp.py's
    # streamable-http transport has no /health route of its own), unlike the
    # shared bim-normalizer image this used to reuse (which needed an explicit
    # disable: true here to override its inherited :8002/health check).
    networks:
      - speckle-net

  # ── BCF-API server ────────────────────────────────────────────────────────────
  bcf-server:
    build:
      context: ./bim-normalizer
      dockerfile: Dockerfile.bcf-server
    image: bcf-server:latest
    pull_policy: build
    container_name: bcf-server
    mem_limit: 512m
    ports:
      - "8004:8004"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-speckle}
      PG_PASS: ${PG_PASS:-speckle}
      PG_NAME: ${PG_NAME:-speckle}
      PORT: 8004
      BCF_API_KEY: ${BCF_API_KEY:-}
      BCF_OIDC_SECRET: ${BCF_OIDC_SECRET:-}
      # Deep-link base for BCF "assigned to" notification emails (see
      # notifications/dispatch.py's notify_bcf_assignment, fired from
      # bcf/topics.py — this is the only bcf-server code that needs either).
      # PUBLIC_APP_URL derives from PUBLIC_BASE_URL if unset (config/settings.py).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Optional idempotent startup seed for one bcf_users account —
      # convenience only, the /admin panel is always reachable via
      # BCF_API_KEY regardless (see config/settings.py).
      BCF_ADMIN_EMAIL: ${BCF_ADMIN_EMAIL:-}
      BCF_ADMIN_PASSWORD: ${BCF_ADMIN_PASSWORD:-}
      # Only needed for the admin panel's "Document roles" project picker
      # (bcf/admin.py's /admin/api/projects — best-effort GraphQL name
      # lookup per stream); bcf-server has no Speckle-sync logic of its own
      # otherwise. Same vars bim-normalizer already gets above.
      SPECKLE_SERVER_URL: ${VITE_SPECKLE_SERVER}
      SPECKLE_TOKEN: ${VITE_SPECKLE_TOKEN}
      # Speckle personal access tokens are server-specific — confirmed on
      # this deployment, the default SPECKLE_TOKEN gets a clean 403 "Your
      # token is not valid" from any other server. Same "name|url|token,..."
      # value already used to build VITE_EXTRA_SPECKLE_SERVERS below, reused
      # here so the admin panel's project-name lookup can pick the right
      # token per project instead of only ever trying the default server's.
      VITE_EXTRA_SPECKLE_SERVERS: ${VITE_EXTRA_SPECKLE_SERVERS:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Needed for the admin panel's "delete project" action (bcf/admin.py's
      # admin_purge_stream): soft-deleting bim_documents rows also deletes
      # the actual files via the WebDAV service account, and tears down the
      # project's Nextcloud group folder via the admin OCS account — same
      # vars bim-normalizer already gets above.
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://nextcloud}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-admin}
      NEXTCLOUD_APP_PASSWORD: ${NEXTCLOUD_APP_PASSWORD:-}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-}
      # notifications/email.py's send_email(), used by BCF issue "assigned to"
      # notifications (bcf/topics.py -> notifications/dispatch.py). Same vars
      # bim-normalizer gets above.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      # bcf-server has no Speckle-sync logic of its own — bim-normalizer's
      # background catch-up scan (main.py's _auto_sync_loop) is what keeps
      # the shared bim_models/bcf_topics tables current. Waiting for it to
      # be healthy at least sequences startup so bcf-server doesn't begin
      # serving before bim-normalizer is up and its scan loop has started
      # (the scan itself still runs async in the background, so this narrows
      # the stale-data window on a full restart rather than eliminating it).
      bim-normalizer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - speckle-net

  # ── Frontend Dashboard (Nginx + built Vite SPA) ──────────────────────────────
  converge:
    build:
      context: .
    container_name: converge
    mem_limit: 256m
    ports:
      - "8080:80"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Reverse-proxy targets (nginx.conf.template)
      NORMALIZER_URL: http://bim-normalizer:8002/
      BCF_SERVER_URL: http://bcf-server:8004/
      # Frontend runtime config, injected into window.__CONFIG__ at container
      # start (config.js.template / docker-entrypoint-config.sh) — same image
      # works for every deployment, no rebuild needed to change any of these.
      VITE_SPECKLE_SERVER: ${VITE_SPECKLE_SERVER}
      VITE_SPECKLE_TOKEN: ${VITE_SPECKLE_TOKEN}
      VITE_NORMALIZER_URL: /normalizer
      VITE_BCF_URL: /bcf
      VITE_BCF_API_KEY: ${BCF_API_KEY:-}
      VITE_OLLAMA_BASE_URL: ${VITE_OLLAMA_BASE_URL:-}
      VITE_OLLAMA_MODEL: ${VITE_OLLAMA_MODEL:-llama3}
      VITE_LMSTUDIO_BASE_URL: ${VITE_LMSTUDIO_BASE_URL:-}
      VITE_LMSTUDIO_MODEL: ${VITE_LMSTUDIO_MODEL:-local-model}
      VITE_MISTRAL_API_KEY: ${VITE_MISTRAL_API_KEY:-}
      VITE_EXTRA_SPECKLE_SERVERS: ${VITE_EXTRA_SPECKLE_SERVERS:-}
      VITE_SHARE_LINK_MODE: ${VITE_SHARE_LINK_MODE:-full}
    depends_on:
      bim-normalizer:
        condition: service_healthy
      bcf-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - speckle-net

volumes:
  pgdata:
  nextcloud_html:
  nextcloud_data:
  nextcloud_config:
  nextcloud_custom_apps:

networks:
  speckle-net:
    driver: bridge
