<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- viewport-fit=cover opts into safe-area-inset-* env() variables — without
       it, bottom-anchored floating widgets (FAB, chat, BCF panel) have no way
       to avoid sitting under the iOS home-indicator/gesture bar on notched devices. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Converge</title>
  <!-- Inter — Speckle's official typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <!-- Runtime config, injected by the Docker entrypoint from container env vars
       (see config.js.template) — a plain non-module script so it's guaranteed
       to run before the deferred module bundle below. Doesn't exist in local
       `npm run dev`/`build`; a missing/404 script tag is harmless and
       src/runtimeConfig.js falls back to import.meta.env in that case. -->
  <script src="/config.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
